[package]
name = "ryo2d"
version = "0.0.1"
edition = "2024"
description = "A simple, scriptable 2D game engine"
documentation = "https://docs.rs/ryo2d"
readme = "README.md"
license = "MIT"
build = "src/build.rs"
# Disable auto-discovery - example games are standalone projects
autoexamples = false

[lib]
name = "ryo2d"
path = "src/lib.rs"

[[bin]]
name = "ryo2d"
path = "src/bin/ryo2d.rs"

[workspace]
members = [
  ".",
  "examples/demos/*",
  "examples/games/*",
]

# Run demos/games with: cargo run -p <name> or ./run run-demos

[dependencies]
arboard = "3.6.1"
bytemuck = { version = "1.21", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
glam = "0.31"
hecs = { version = "0.11", features = ["macros"] }
image = "0.25"
kira = "0.11"
notify = "7"
pollster = "0.4"
rapier2d = "0.22"
renet = "2.0"
renet_netcode = "2.0"
resvg = "0.44"
ron = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny-skia = "0.11"
toml = "0.9.11"
wgpu = "22"
winit = "0.30"
gilrs = "0.11"
zip = "2"
noise = "0.9"
rand = "0.8"

# Optional profiling dependency (enable with --features profiler)
puffin = { version = "0.19", optional = true }

# Optional WebRTC transport for NAT traversal (enable with --features matchbox)
matchbox_socket = { version = "0.10", optional = true, features = ["ggrs"] }

[features]
default = []
profiler = ["puffin"]
matchbox = ["matchbox_socket"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# Dev builds: optimize dependencies and engine for performance, keep game code light for fast iteration
# The engine's pixel operations (parallax, sprite blitting) need full optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ryo2d]
opt-level = 3

# Release builds with debug symbols for profiling (flamegraph, perf, etc.)
# This enables function names in profiles without affecting runtime performance.
[profile.release]
debug = true

# Profiling profile: optimized like release but with full debug symbols
# Use with: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
