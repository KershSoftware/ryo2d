[package]
name = "ryo2d"
version = "0.0.1"
edition = "2024"
description = "A simple, scriptable 2D game engine"
documentation = "https://docs.rs/ryo2d"
readme = "README.md"
license = "MIT"
# Disable auto-discovery - example games are standalone projects
autoexamples = false

[lib]
name = "ryo2d"
path = "src/lib.rs"

# Example games are standalone projects in examples/ - run them with:
#   cd examples/breakout && cargo run
# Or use the run script: ./run breakout

[dependencies]
crossbeam-channel = "0.5"
flate2 = "1.1"
glam = "0.31"
hecs = { version = "0.11", features = ["macros"] }
image = "0.25"
kira = "0.11"
notify = "7"
pixels = "0.15"
rapier2d = "0.22"
ron = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2"
toml = "0.9.11"
winit = "0.30"

[dev-dependencies]
tempfile = "3"
