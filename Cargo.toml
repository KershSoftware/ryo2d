[package]
name = "ferrum2d"
version = "0.0.1"
edition = "2024"
description = "A simple, scriptable 2D game engine"
documentation = "https://docs.rs/ferrum2d"
readme = "README.md"
license = "MIT"

[lib]
name = "ferrum2d"
path = "src/lib.rs"

[[bin]]
name = "ferrum2d-demo"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
glam = "0.31"
hecs = { version = "0.11", features = ["macros"] }
image = "0.25"
kira = "0.11"
notify = "7"
pixels = "0.15"
rapier2d = "0.22"
thiserror = "2"
winit = "0.30"
