[package]
name = "ryo2d"
version = "0.0.1"
edition = "2024"
description = "An agent-first 2D game engine"
readme = "README.md"
license = "MIT"
build = "src/build.rs"
# Disable auto-discovery - example games are standalone projects
autoexamples = false

[lib]
name = "ryo2d"
path = "src/lib.rs"

[[bin]]
name = "ryo2d"
path = "src/bin/ryo2d.rs"

[workspace]
members = [
  ".",
  "crates/*",
  "examples/demo-kit",
  "examples/demos/*",
  "examples/games/*",
]

# Run demos/games with: cargo run -p <name> or ./dev demos:run-all

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
crossbeam-channel = "0.5"
flate2 = "1.1"
glam = { version = "0.31", features = ["serde"] }
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }
bitflags = "2"
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "backtrace"] }
half = { version = "2", features = ["bytemuck"] }
image = "0.25"
kira = "0.11"
rapier2d = { version = "=0.36.1", features = ["debug-render"] }
resvg = "0.44"
ron = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tiny-skia = "0.11"
toml = "0.9.11"
wgpu = "30.0.1"
naga = { version = "30.0.1", features = ["wgsl-in"] }
winit = "0.30"
gilrs = "0.11"
rand = "0.8"
etagere = "0.2"
# Text: layout (no system fonts), glyph rasterization, MSDF generation.
# Named only in src/core/text/.
parley = { version = "0.12", default-features = false, features = ["std"] }
swash = "0.2.10"
fdsm = "0.8"
ryo2d-derive = { path = "crates/ryo2d-derive" }

web-time = "1.1"

# Native only: the desktop's clipboard, file system, threads, sockets and
# dev tooling, all compiled out of the web build
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
dirs = "6"
notify = "7"
pollster = "0.4"
renet = "2.0"
renet_netcode = "2.0"
zip = "2"

# Optional profiling dependency (enable with --features profiler)
puffin = { version = "0.19", optional = true }

# Optional WebRTC transport for NAT traversal (enable with --features matchbox)
matchbox_socket = { version = "0.10", optional = true, features = ["ggrs"] }

# The web build: the browser's event loop, futures and panics, and its
# random-number backend (gilrs picks its web gamepad backend by target)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CssStyleDeclaration", "console"] }
console_error_panic_hook = "0.1.7"
# The web is single-threaded: let wgpu's types be Send + Sync there too
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[features]
default = ["default-fonts"]
# Built-in fonts (Inter, JetBrains Mono, m5x7) embedded in the engine
default-fonts = []
profiler = ["puffin"]
matchbox = ["matchbox_socket"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
criterion = "0.5"

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "physics"
harness = false

[[bench]]
name = "text"
harness = false

[[bench]]
name = "ui"
harness = false

# Dev builds: optimize dependencies and engine for performance, keep game code light for fast iteration
# The engine's pixel operations (parallax, sprite blitting) need full optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.ryo2d]
opt-level = 3

# Release builds with debug symbols for profiling (flamegraph, perf, etc.)
# This enables function names in profiles without affecting runtime performance.
[profile.release]
debug = true

# Profiling profile: optimized like release but with full debug symbols
# Use with: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true

# Patched matchbox_socket: survive signaling server disconnection.
# The upstream breaks the message loop when signaling errors, killing P2P data
# channels. Our patch keeps the message loop alive so established WebRTC
# connections continue working after the signaling server drops.
[patch.crates-io]
matchbox_socket = { path = "patches/matchbox_socket" }
