# Y-Sorting Demo - Ryo2D Project Configuration

[project]
name = "Y-Sorting Demo"

[paths]
entry_point = "main.rs"
save_data = "data"
assets = "assets"

# ==============================================================================
# USER-FACING DEFAULTS
# Players' changes to these are kept in system.json (only what differs from here)
# ==============================================================================

[system]
# The game's resolution; a player's window size is kept apart, in system.json
# Using small resolution with integer scaling for pixel-perfect look
resolution = "320x240"
# Enable VSync for smoother rendering (recommended)
vsync = true
# Display mode: "windowed", "exclusive_fullscreen", or "borderless_fullscreen"
display_mode = "windowed"
# Audio volume defaults (0.0 - 1.0)
master_volume = 0.89
music_volume = 1.0
sfx_volume = 1.0
ui_volume = 1.0
voice_volume = 1.0
ambience_volume = 1.0
show_fps = false

# ==============================================================================
# DEVELOPER-ONLY SETTINGS
# These are NOT written to system.json - they're for development.
# ==============================================================================

[debug]
# Show collision boundaries for debugging
show_colliders = false
# Show velocity vectors (useful for physics debugging)
show_velocities = false
# Show entity origin points
show_origins = false

[env]
# Add your game-specific configuration here
# debug_mode = false
