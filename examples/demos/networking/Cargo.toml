[package]
name = "networking"
version = "0.1.0"
edition = "2024"
description = "Multiplayer platformer demo built with Ryo2D engine"

[[bin]]
name = "networking"
path = "main.rs"

[dependencies]
ryo2d = { path = "../../.." }
demo-kit = { path = "../../demo-kit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
