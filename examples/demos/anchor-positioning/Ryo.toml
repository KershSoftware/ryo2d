# Anchor Positioning Demo - Ryo2D Engine Project Configuration
# Demonstrates sprite anchors (Renderable::with_anchor) and child offsets

[project]
name = "Anchor Positioning Demo"

[paths]
entry_point = "main.rs"
assets = "assets"

[system]
resolution = "800x600"
vsync = true
display_mode = "windowed"
show_fps = true

[debug]
show_origins = true
