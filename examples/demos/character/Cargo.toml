[package]
name = "character-demo"
version = "0.1.0"
edition = "2024"
description = "Character controller, platformer and top-down presets, and custom movement demo for Ryo2D engine"
default-run = "character-demo"

[lib]
name = "character_demo"
path = "src/lib.rs"

[[bin]]
name = "character-demo"
path = "src/main.rs"

[dependencies]
ryo2d = { path = "../../.." }
demo-kit = { path = "../../demo-kit" }
