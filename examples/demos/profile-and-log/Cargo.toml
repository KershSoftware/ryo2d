[package]
name = "profile-and-log"
version = "0.1.0"
edition = "2024"
description = "Profiler and logger demo for Ryo2D engine"

[[bin]]
name = "profile-and-log"
path = "main.rs"

[features]
default = []
profiler = ["ryo2d/profiler", "dep:puffin"]

[dependencies]
ryo2d = { path = "../../.." }
puffin = { version = "0.19", optional = true }
rand = "0.8"
