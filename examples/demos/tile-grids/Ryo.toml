# Tile Grids Demo - Ryo2D Engine Project Configuration
# A hand-made Tiled meadow in an endless streamed world, painting an
# infinite map anywhere, an endless world that keeps what you dig and build,
# and isometric, staggered, hexagonal and oblique maps and their speed

[project]
name = "Tile Grids Demo"

[paths]
entry_point = "src/main.rs"
assets = "assets"

[system]
resolution = "960x600"
vsync = true
display_mode = "windowed"
show_fps = true
