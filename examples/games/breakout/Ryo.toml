# Breakout - Ryo2D Demo
# This file configures the example project for the Ryo2D engine

[project]
name = "Breakout"

[paths]
# Entry point is in this directory (not in src/)
entry_point = "main.rs"
# Save data directory (created on demand)
save_data = "data"
# Assets directory
assets = "assets"

# =============================================================================
# USER-FACING DEFAULTS
# These sections are written to system.json when first created.
# Players can override these in system.json; their changes persist.
# =============================================================================

# [system] - Display and audio settings
[system]
# Breakout's design resolution (matches game constants)
resolution_width = 1280
resolution_height = 720
# VSync enabled by default
vsync = true
# Start windowed
fullscreen = false
# Audio defaults (engine: master=0.8, music=1.0, sfx=1.0)
master_volume = 0.8
music_volume = 0.6
sfx_volume = 1.0

# [info] - Information overlays (also maps to system.json)
[info]
title = "Breakout - Ryo2D"
# Display FPS counter in corner (user can toggle)
show_fps = true

# =============================================================================
# DEVELOPER-ONLY SETTINGS
# These are NOT written to system.json - they're for development.
# =============================================================================

[debug]
# Show collision boundaries for debugging
show_colliders = false
# Show velocity vectors (useful for physics debugging)
show_velocities = false
# Show entity origin points
show_origins = false
# Enable detailed profiling (per-phase timing, slow frame warnings)
# Default: true - set to false to disable timing measurements
# enable_profiling = true

# =============================================================================
# [env] - Game-specific environment variables
# =============================================================================
[env]
# Set to true to enable debug mode with level switching (Q/E keys)
debug_scene = false
