# Breakout - Ryo2D Demo

[project]
name = "Breakout"
title = "Breakout - Ryo2D"
version = "0.0.1"

[paths]
entry_point = "main.rs"
save_data = "data"
assets = "assets"

# =============================================================================
# USER-FACING DEFAULTS
# Players' changes to these are kept in system.json (only what differs from here)
# =============================================================================

[system]
vsync = true
display_mode = "windowed"
master_volume = 0.89
music_volume = 0.77
sfx_volume = 1.0
ui_volume = 1.0
voice_volume = 1.0
ambience_volume = 1.0
show_fps = true

# =============================================================================
# DEVELOPER-ONLY SETTINGS
# These are NOT written to system.json - they're for development.
# =============================================================================

[debug]
show_colliders = false
show_velocities = false
show_origins = false
enable_profiler = false

# ==============================================================================
# RELEASE/DISTRIBUTION SETTINGS
# Build-time settings for `ryo2d build`
# ==============================================================================

[release]
# logo = "assets/icon.png"
