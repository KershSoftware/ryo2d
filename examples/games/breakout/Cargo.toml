[package]
name = "breakout"
version = "0.1.0"
edition = "2024"
description = "Breakout demo game built with Ryo2D engine"

[[bin]]
name = "breakout"
path = "main.rs"

[features]
# Enable puffin profiler (use with `ryo2d dev -p`)
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
