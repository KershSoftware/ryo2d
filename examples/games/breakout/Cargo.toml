[package]
name = "breakout"
version = "0.1.0"
edition = "2024"
description = "Breakout demo game built with Ryo2D engine"

[[bin]]
name = "breakout"
path = "main.rs"

[features]
default = []
# Enable puffin profiler (use with `ryo2d dev --profiler`)
profiler = ["ryo2d/profiler", "dep:puffin"]

[dependencies]
# Use path dependency during development
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
puffin = { version = "0.19", optional = true }

# Optimize dependencies in dev builds for playable performance
# Your game code stays unoptimized for fast compile times
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ryo2d]
opt-level = 2
