[package]
name = "netplay"
version = "0.1.0"
edition = "2024"
description = "Multiplayer platformer demo built with Ryo2D engine"

[[bin]]
name = "netplay"
path = "main.rs"

[dependencies]
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
