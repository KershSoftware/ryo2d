[package]
name = "leap"
version = "0.1.0"
edition = "2024"
description = "Leap King - Multiplayer platformer where players leap in arc trajectories"
build = "build.rs"

[[bin]]
name = "leap"
path = "main.rs"

[lib]
name = "leap"
path = "src/lib.rs"

[features]
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
dirs = "6"

[build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ryo2d]
opt-level = 2
