# Leap King - Ryo2D Project Configuration

[project]
name = "Leap King"
title = "Leap King - Ryo2D"
version = "0.0.1"
description = "Leap King - Multiplayer platformer where players leap in arc trajectories"

[paths]
entry_point = "main.rs"
save_data = "data"
assets = "assets"

# =============================================================================
# USER-FACING DEFAULTS
# Players' changes to these are kept in system.json (only what differs from here)
# =============================================================================

[system]
vsync = false
display_mode = "borderless_fullscreen"
master_volume = 0.89
show_fps = false
target_background_fps = 0
background_rendering = true

# =============================================================================
# DEVELOPER-ONLY SETTINGS
# These are NOT written to system.json - they're for development
# =============================================================================

[debug]
console = true
show_colliders = false
show_velocities = false
show_origins = false
enable_profiler = false

# ==============================================================================
# RELEASE/DISTRIBUTION SETTINGS
# Build-time settings for `ryo2d build`
# ==============================================================================

[release]
# logo = "assets/icon.png"
