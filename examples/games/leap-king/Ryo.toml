# Leap King - Ryo2D Project Configuration

[project]
name = "Leap King"
title = "Leap King - Ryo2D"
version = "0.0.1"

[paths]
entry_point = "main.rs"
save_data = "data"
assets = "assets"

# =============================================================================
# USER-FACING DEFAULTS
# Written and prioritized read from system.json when `.with_user_preferences` set
# =============================================================================

[system]
vsync = true
display_mode = "windowed"
master_volume = 0.8
show_fps = true
dev_console = true

# =============================================================================
# DEVELOPER-ONLY SETTINGS
# These are NOT written to system.json - they're for development
# =============================================================================

[debug]
show_colliders = false
show_velocities = false
show_origins = false
enable_profiler = true

# ==============================================================================
# RELEASE/DISTRIBUTION SETTINGS
# Build-time settings for `ryo2d build`
# ==============================================================================

[release]
# logo = "assets/icon.png"

