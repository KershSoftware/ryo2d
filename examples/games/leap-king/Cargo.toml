[package]
name = "leap-king"
version = "0.1.0"
edition = "2024"
description = "Leap King - Multiplayer platformer where players leap in arc trajectories"
build = "build.rs"

[[bin]]
name = "leap-king"
path = "main.rs"

[lib]
name = "leap_king"
path = "src/lib.rs"

[features]
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"

[build-dependencies]
winresource = "0.1"
