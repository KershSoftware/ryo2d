[package]
name = "leap-king"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "leap-king"
path = "main.rs"

[lib]
name = "leap_king"
path = "src/lib.rs"

[features]
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../..", features = ["matchbox"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
