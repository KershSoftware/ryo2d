# Flappy Demo - Ryo Engine Project Configuration
# This file configures the example project for the Ryo2D engine

[project]
name = "Flappy Demo"

[paths]
# Entry point is in this directory (not in src/)
entry_point = "main.rs"
# Save data directory (created on demand)
save_data = "data"
# Assets directory
assets = "assets"

# ==============================================================================
# USER-FACING DEFAULTS
# ==============================================================================

[system]
# Flappy uses a portrait orientation (mobile-style)
resolution_width = 400
resolution_height = 600
vsync = true
fullscreen = false
master_volume = 0.8
music_volume = 1.0
sfx_volume = 1.0

[info]
# Display FPS counter in corner
show_fps = false

[debug]
# Show collision boundaries for debugging
show_colliders = false
# Show velocity vectors (useful for physics debugging)
show_velocities = false
# Show entity origin points
show_origins = false

[env]
# Game-specific configuration (not engine features)
# Set to true to start with the debug scene instead of menu
debug_scene = false
