[package]
name = "flappy"
version = "1.0.0"
edition = "2024"

[features]
# Enable puffin profiler (use with `ryo2d dev -p`)
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../../" }
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "flappy"
path = "main.rs"

[lib]
name = "flappy"
path = "src/lib.rs"
