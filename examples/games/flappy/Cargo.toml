[package]
name = "flappy"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enable puffin profiler (use with `ryo2d dev --profiler`)
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../../" }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"

[[bin]]
name = "flappy"
path = "main.rs"

[lib]
name = "flappy"
path = "src/lib.rs"
