# Bullet Hell - Ryo2D Demo
# This demo showcases GPU sprite batching with hundreds of bullets and particles

[project]
name = "Bullet Hell"
title = "Bullet Hell - Ryo2D"
version = "0.1.0"

[system]
show_fps = true
# Design resolution - game logic uses this fixed size
# Window can be scaled larger/smaller, engine handles letterboxing
resolution = "1920x1080"
display_mode = "windowed"
vsync = false
console = true

[paths]
# Entry point is in this directory (not in src/)
entry = "main.rs"

[debug]
show_colliders = false
show_velocities = false
show_origins = false