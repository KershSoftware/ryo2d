[package]
name = "bullet-hell"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bullet-hell"
path = "main.rs"

[features]
default = []
# Enable puffin profiler (use with `ryo2d dev --profiler`)
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../.." }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
