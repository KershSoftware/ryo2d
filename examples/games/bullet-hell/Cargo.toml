[package]
name = "bullet-hell"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bullet-hell"
path = "main.rs"

[features]
# Enable puffin profiler (use with `ryo2d dev -p`)
profiler = ["ryo2d/profiler"]

[dependencies]
ryo2d = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
